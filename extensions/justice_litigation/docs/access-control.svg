<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" role="img" aria-labelledby="title desc">
  <title id="title">Who can see litigation list vs encrypted content</title>
  <desc id="desc">Submitter and Justice department members decrypt content; defendants cannot; admins may list cases without reading encrypted narratives.</desc>
  <defs>
    <style>
      .label { font: 600 14px system-ui, Segoe UI, sans-serif; fill: #111827; }
      .sub { font: 12px system-ui, Segoe UI, sans-serif; fill: #6b7280; }
      .head { font: 700 13px system-ui, Segoe UI, sans-serif; fill: #374151; }
      .mono { font: 11px ui-monospace, Menlo, monospace; fill: #4b5563; }
    </style>
  </defs>

  <rect width="860" height="420" rx="16" fill="#ffffff" stroke="#e5e7eb"/>

  <text x="430" y="34" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#111827">Who sees what?</text>
  <text x="430" y="56" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#6b7280">Example case filed by Alice against Carol</text>

  <!-- Header row -->
  <rect x="40" y="78" width="780" height="34" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text class="head" x="150" y="100">Person</text>
  <text class="head" x="390" y="100">Case in list?</text>
  <text class="head" x="640" y="100">Title &amp; description?</text>

  <!-- Alice -->
  <rect x="40" y="122" width="780" height="62" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <circle cx="78" cy="153" r="16" fill="#4f46e5"/>
  <text x="78" y="158" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#ffffff">A</text>
  <text class="label" x="104" y="146">Alice</text>
  <text class="sub" x="104" y="164">Submitter · aaaaa-aa&</text>
  <text class="label" x="390" y="158" fill="#047857">Yes</text>
  <text class="label" x="640" y="158" fill="#047857">Yes  decrypts in browser</text>

  <!-- Bob -->
  <rect x="40" y="194" width="780" height="62" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
  <circle cx="78" cy="225" r="16" fill="#059669"/>
  <text x="78" y="230" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#ffffff">B</text>
  <text class="label" x="104" y="218">Bob</text>
  <text class="sub" x="104" y="236">Justice department · bbbbb-bb&</text>
  <text class="label" x="390" y="228" fill="#047857">Yes</text>
  <text class="label" x="640" y="228" fill="#047857">Yes  decrypts in browser</text>

  <!-- Carol -->
  <rect x="40" y="266" width="780" height="62" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <circle cx="78" cy="297" r="16" fill="#dc2626"/>
  <text x="78" y="302" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#ffffff">C</text>
  <text class="label" x="104" y="290">Carol</text>
  <text class="sub" x="104" y="308">Defendant · ccccc-cc&</text>
  <text class="label" x="390" y="300" fill="#b91c1c">No</text>
  <text class="label" x="640" y="300" fill="#b91c1c">No  not an authorized recipient</text>

  <!-- Dave -->
  <rect x="40" y="338" width="780" height="62" rx="10" fill="#fffbeb" stroke="#fde68a"/>
  <circle cx="78" cy="369" r="16" fill="#d97706"/>
  <text x="78" y="374" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#ffffff">D</text>
  <text class="label" x="104" y="362">Dave</text>
  <text class="sub" x="104" y="380">Realm admin (not Justice dept) · ddddd-dd&</text>
  <text class="label" x="390" y="372" fill="#047857">Yes</text>
  <text class="label" x="640" y="372" fill="#b45309">No  Encrypted  no access</text>
</svg>
