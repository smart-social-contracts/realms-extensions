<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" role="img" aria-labelledby="title desc">
  <title id="title">Public metadata vs encrypted case content</title>
  <desc id="desc">Case lists store public metadata on-chain while titles and descriptions stay encrypted as vetKeys ciphertext.</desc>
  <defs>
    <linearGradient id="publicFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="secretFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6366f1"/>
    </marker>
  </defs>

  <rect width="820" height="360" rx="16" fill="#ffffff" stroke="#e5e7eb"/>

  <text x="410" y="36" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#111827">What the realm stores for a private case</text>
  <text x="410" y="58" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#6b7280">Metadata is visible in lists; narrative content stays encrypted</text>

  <rect x="40" y="88" width="340" height="220" rx="14" fill="url(#publicFill)" stroke="#818cf8" stroke-width="2"/>
  <text x="210" y="118" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#312e81">Public on-chain metadata</text>
  <text x="210" y="140" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#4338ca">Returned by get_litigations / get_cases</text>

  <g font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#1f2937">
    <rect x="70" y="158" width="280" height="28" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="86" y="177">Case ID / case number</text>
    <rect x="70" y="194" width="280" height="28" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="86" y="213">Status, requester, defendant, dates</text>
    <rect x="70" y="230" width="280" height="28" rx="8" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="86" y="249">Court assignment, verdict actions</text>
  </g>

  <rect x="440" y="88" width="340" height="220" rx="14" fill="url(#secretFill)" stroke="#34d399" stroke-width="2"/>
  <text x="610" y="118" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#065f46">Encrypted (vetKeys)</text>
  <text x="610" y="140" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#047857">LitigationContent.ciphertext only</text>

  <g transform="translate(610,178)">
    <rect x="-120" y="-18" width="240" height="36" rx="8" fill="#ffffff" stroke="#a7f3d0"/>
    <path d="M-108,-2 h8 v-6 a6 6 0 0 1 12 0 v6 h8 a2 2 0 0 1 2 2 v10 a2 2 0 0 1-2 2 h-28 a2 2 0 0 1-2-2 v-10 a2 2 0 0 1 2-2 z" fill="none" stroke="#059669" stroke-width="1.5"/>
    <text x="0" y="6" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#1f2937">Title</text>
  </g>
  <g transform="translate(610,228)">
    <rect x="-120" y="-18" width="240" height="36" rx="8" fill="#ffffff" stroke="#a7f3d0"/>
    <path d="M-108,-2 h8 v-6 a6 6 0 0 1 12 0 v6 h8 a2 2 0 0 1 2 2 v10 a2 2 0 0 1-2 2 h-28 a2 2 0 0 1-2-2 v-10 a2 2 0 0 1 2-2 z" fill="none" stroke="#059669" stroke-width="1.5"/>
    <text x="0" y="6" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#1f2937">Description</text>
  </g>
  <text x="610" y="278" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#047857">enc:v=2:...</text>

  <rect x="250" y="318" width="320" height="28" rx="14" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="410" y="337" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#374151">Realm canister never sees plaintext, DEK, or vetKey material</text>

  <line x1="210" y1="308" x2="330" y2="318" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="610" y1="308" x2="490" y2="318" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
