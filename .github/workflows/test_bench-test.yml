name: Test Bench Test

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'extensions/test_bench/**'
      - '.github/workflows/test_bench-test.yml'
  pull_request:
    branches: [ main, develop, feat/layered-codex ]
    paths:
      - 'extensions/test_bench/**'
      - '.github/workflows/test_bench-test.yml'

jobs:
  test:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install base dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black isort flake8
        
    - name: Install extension dependencies
      run: |
        cd extensions/test_bench
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi
        
    - name: Run linters
      run: |
        cd extensions/test_bench
        if [ -d backend ]; then
          echo "Running black..."
          black backend --check
          echo "Running isort..."
          isort backend --check-only --profile black
          echo "Running flake8..."
          flake8 backend --config ../../.github/flake8.cfg
        fi
        
    - name: Run tests
      run: |
        cd extensions/test_bench
        if [ -f run_tests.sh ]; then
          bash run_tests.sh
        else
          echo "::warning::extensions/test_bench has no run_tests.sh: this check ran no tests"
          echo "ℹ️  Add run_tests.sh to enable automated testing"
        fi
