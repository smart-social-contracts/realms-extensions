name: Justice Litigation Test

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'extensions/justice_litigation/**'
      - '.github/workflows/justice_litigation-test.yml'
  pull_request:
    branches: [ main, develop, feat/layered-codex ]
    paths:
      - 'extensions/justice_litigation/**'
      - '.github/workflows/justice_litigation-test.yml'

jobs:
  test:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install base dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black isort flake8
        
    - name: Install extension dependencies
      run: |
        cd extensions/justice_litigation
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi
        
    - name: Run linters
      # Failing since this lint was made real (ci-signal-audit, 2026-11-17): black, and for some extensions isort, want
      # backend/ reformatted. Non-blocking until `black backend` is applied; that edits extensions/justice_litigation/, which makes
      # the next release bump its patch version. Delete `continue-on-error` when it is clean.
      continue-on-error: true
      run: |
        cd extensions/justice_litigation
        if [ -d backend ]; then
          echo "Running black..."
          black backend --check
          echo "Running isort..."
          isort backend --check-only --profile black
          echo "Running flake8..."
          flake8 backend --config ../../.github/flake8.cfg
        fi
        
    - name: Run tests
      run: |
        cd extensions/justice_litigation
        if [ -f run_tests.sh ]; then
          bash run_tests.sh
        else
          echo "::warning::extensions/justice_litigation has no run_tests.sh: this check ran no tests"
          echo "ℹ️  Add run_tests.sh to enable automated testing"
        fi
