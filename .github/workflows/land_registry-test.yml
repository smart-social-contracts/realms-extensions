name: Land Registry Test

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'extensions/land_registry/**'
      - 'extensions/_shared/**'
      - '.github/workflows/land_registry-test.yml'
  pull_request:
    branches: [ main, develop, feat/layered-codex ]
    paths:
      - 'extensions/land_registry/**'
      - 'extensions/_shared/**'
      - '.github/workflows/land_registry-test.yml'

jobs:
  test:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install base dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black isort flake8
        
    - name: Install extension dependencies
      run: |
        cd extensions/land_registry
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi
        
    - name: Run linters
      # Failing since this lint was made real (ci-signal-audit, 2026-11-17): black, and for some extensions isort, want
      # backend/ reformatted. Non-blocking until `black backend` is applied; that edits extensions/land_registry/, which makes
      # the next release bump its patch version. Delete `continue-on-error` when it is clean.
      continue-on-error: true
      run: |
        cd extensions/land_registry
        if [ -d backend ]; then
          echo "Running black..."
          black backend --check
          echo "Running isort..."
          isort backend --check-only --profile black
          echo "Running flake8..."
          flake8 backend --config ../../.github/flake8.cfg
        fi
        
    - name: Run tests
      run: |
        cd extensions/land_registry
        if [ -f run_tests.sh ]; then
          bash run_tests.sh
        else
          echo "ℹ️  No run_tests.sh found - skipping tests"
          echo "ℹ️  Add run_tests.sh to enable automated testing"
        fi
