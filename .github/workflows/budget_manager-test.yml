name: Budget Manager Test

on:
  push:
    branches: [ main, develop, feat/layered-codex ]
    paths:
      - 'extensions/budget_manager/**'
      - 'extensions/_shared/frontend/**'
      - '.github/workflows/budget_manager-test.yml'
  pull_request:
    branches: [ main, develop, feat/layered-codex ]
    paths:
      - 'extensions/budget_manager/**'
      - 'extensions/_shared/frontend/**'
      - '.github/workflows/budget_manager-test.yml'

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      working-directory: extensions/budget_manager/frontend-rt
      run: npm install --no-audit --no-fund --silent

    - name: Build
      working-directory: extensions/budget_manager/frontend-rt
      run: npm run build
