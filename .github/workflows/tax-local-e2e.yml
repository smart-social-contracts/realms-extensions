name: Tax manager UI test (local realm)

# Starts a realm on the runner with `realms local start`, installs the tax_manager extension from this checkout
# and drives its UI in Playwright, checking the realm's own state afterwards. Needs no shared test realm.

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'extensions/tax_manager/**'
      - 'extensions/_shared/testing/e2e/**'
      - '.github/actions/local-realm/**'
      - '.github/workflows/tax-local-e2e.yml'
  pull_request:
    paths:
      - 'extensions/tax_manager/**'
      - 'extensions/_shared/testing/e2e/**'
      - '.github/actions/local-realm/**'
      - '.github/workflows/tax-local-e2e.yml'
  schedule:
    # Nightly against the newest realm release, pre-releases included: the break to catch is an extension
    # that no longer loads on the realm about to ship
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      realms_version:
        description: 'Realms release to run (a tag, or latest)'
        default: v0.8.0-rc2
        type: string

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Local realm with the tax_manager extension
        uses: ./.github/actions/local-realm
        with:
          extension: extensions/tax_manager
          # tax_manager declares capabilities that v0.7.0 (the latest release) cannot load; v0.8.0-rc2 can.
          realms-version: ${{ inputs.realms_version || (github.event_name == 'schedule' && 'newest' || 'v0.8.0-rc2') }}

      - name: Install the test dependencies
        run: |
          npm install --no-audit --no-fund --prefix extensions/_shared/testing/e2e
          npm install --no-audit --no-fund --prefix extensions/tax_manager/tests/e2e
          npx --prefix extensions/tax_manager/tests/e2e playwright install --with-deps chromium

      - name: Tax manager UI test
        working-directory: extensions/tax_manager/tests/e2e
        run: npx playwright test

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tax-local-e2e
          path: |
            extensions/tax_manager/tests/e2e/playwright-report
            extensions/tax_manager/tests/e2e/test-results
          if-no-files-found: ignore
          retention-days: 14
