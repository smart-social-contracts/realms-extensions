name: System Info Test

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'extensions/system_info/**'
      - 'extensions/_shared/**'
      - '.github/workflows/system_info-test.yml'
  pull_request:
    branches: [ main, develop, feat/layered-codex ]
    paths:
      - 'extensions/system_info/**'
      - 'extensions/_shared/**'
      - '.github/workflows/system_info-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install base dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black isort flake8
        
    - name: Install extension dependencies
      run: |
        cd extensions/system_info
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi
        
    - name: Run linters
      # Failing since this lint was made real (ci-signal-audit, 2026-11-17): black, and for some extensions isort, want
      # backend/ reformatted. Non-blocking until `black backend` is applied; that edits extensions/system_info/, which makes
      # the next release bump its patch version. Delete `continue-on-error` when it is clean.
      continue-on-error: true
      run: |
        cd extensions/system_info
        if [ -d backend ]; then
          echo "Running black..."
          black backend --check
          echo "Running isort..."
          isort backend --check-only --profile black
          echo "Running flake8..."
          flake8 backend --config ../../.github/flake8.cfg
        fi
        
    - name: Run backend tests
      run: |
        cd extensions/system_info
        if [ -f run_tests.sh ]; then
          bash run_tests.sh
        else
          echo "::warning::extensions/system_info has no run_tests.sh: this check ran no backend tests"
          echo "ℹ️  UI tests run in the local-realm workflows, where an extension has one"
        fi

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install E2E dependencies
      run: |
        if [ -d extensions/system_info/tests/e2e ]; then
          cd extensions/system_info/tests/e2e
          npm install
          npx playwright install chromium --with-deps
        fi

    - name: Upload test logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: system-info-test-logs
        path: extensions/system_info/test-logs/
        retention-days: 14
        if-no-files-found: warn

    - name: Upload E2E results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: system-info-e2e-results
        path: |
          extensions/system_info/tests/e2e/test-results/
          extensions/system_info/tests/e2e/playwright-report/
        retention-days: 14
        if-no-files-found: warn
