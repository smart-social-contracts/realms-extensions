# The flake8 settings the extension lint workflows share (*-test.yml, `flake8 backend --config ../../.github/flake8.cfg`).
# They are vault's own .flake8: black wraps code at 88 columns but never wraps a string or a comment, so flake8's default
# 79 columns and black can never both pass on the same file.
[flake8]
ignore = E501, W503, E704, E402, F401, W293, F841, E203, F541
max-line-length = 88
